name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Validation only -- this workflow never deploys. `npm run deploy:dev` / `npm run deploy:prod`
# from backend/cdk/ remain the only path to AWS, run manually by a human
# (docs/development/AGENT_PROTOCOL.md "Deploys stay separate from CI").
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # setup-uv brings its own uv install/cache management -- installs the pinned uv version and,
      # with cache-dependency-glob, restores/saves its download cache keyed on the lock file's
      # content hash, replacing the old "Cache Poetry virtualenv" step.
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: "backend/lambda/uv.lock"
      - name: uv sync
        run: uv sync --project backend/lambda --all-extras
        env:
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      - name: nox (lint, typecheck, test)
        run: .venv/bin/nox -s lint typecheck test

  cdk-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/cdk/package-lock.json
      - name: Install dependencies
        working-directory: backend/cdk
        run: npm install --no-audit --no-fund
      - name: Build (tsc)
        working-directory: backend/cdk
        run: npm run build

  spec-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Not worth caching: a single `pip install pyyaml` (no lockfile for setup-python's cache: pip
      # to key on) costs a couple of seconds, not worth the risk of it erroring on a missing
      # dependency file.
      - run: pip install pyyaml
      - run: python3 scripts/check_specs.py

  bedrock-cost-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 scripts/check_bedrock_cost_review.py origin/main

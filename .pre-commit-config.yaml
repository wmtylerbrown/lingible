repos:
  # Black - Code formatting
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=88]
        files: ^backend/lambda/src/.*\.py$

  # Flake8 - Linting
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: [--max-line-length=88]
        files: ^backend/lambda/src/.*\.py$
        exclude: ^backend/lambda/src/utils/slang_words\.py$

  # MyPy - Type checking. A local hook shelling into backend/lambda's own Poetry environment,
  # rather than the mirrors-mypy hook's isolated venv, so it reads backend/lambda/mypy.ini (the
  # pydantic plugin and the per-module ignore_missing_imports overrides) instead of a bare
  # --ignore-missing-imports run -- see specs/mypy-package-identity-fix.md. Runs the same
  # whole-tree `mypy src/` as scripts/verify/CI, since mypy's module resolution needs the full
  # src/ tree together, not just the files that changed.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend/lambda, project config)
        entry: bash -c 'cd backend/lambda && poetry run mypy src/'
        language: system
        pass_filenames: false
        files: ^backend/lambda/src/.*\.py$
        exclude: ^backend/lambda/src/utils/slang_words\.py$

  # Trailing whitespace and end-of-file fixes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

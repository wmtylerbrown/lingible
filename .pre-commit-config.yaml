repos:
  # Ruff - Formatting + linting (replaces Black + Flake8; config in backend/lambda/pyproject.toml,
  # see specs/backend-python-toolchain.md). ruff-format is Black-compatible; ruff (lint) mirrors
  # what bare `flake8 src/` was already checking.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-format
        files: ^backend/lambda/src/.*\.py$
      - id: ruff
        args: [--fix]
        files: ^backend/lambda/src/.*\.py$

  # MyPy - Type checking. A local hook shelling into backend/lambda's own uv-managed environment,
  # rather than the mirrors-mypy hook's isolated venv, so it reads backend/lambda/mypy.ini (the
  # pydantic plugin and the per-module ignore_missing_imports overrides) instead of a bare
  # --ignore-missing-imports run -- see specs/mypy-package-identity-fix.md. Runs the same
  # whole-tree `mypy src/` as scripts/verify/CI, since mypy's module resolution needs the full
  # src/ tree together, not just the files that changed.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend/lambda, project config)
        entry: bash -c 'cd backend/lambda && ../../.venv/bin/mypy src/'
        language: system
        pass_filenames: false
        files: ^backend/lambda/src/.*\.py$
        exclude: ^backend/lambda/src/utils/slang_words\.py$

  # Trailing whitespace and end-of-file fixes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
